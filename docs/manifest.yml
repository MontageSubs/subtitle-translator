# Only documents listed here are published. Each entry maps to docs/<slug>/<locale>.md.
#
#   slug:      directory name under docs/ (required)
#   route:     docs (default) | contribute | tools | about
#   category:  help | legal | community | ecosystem | general
#   title:     per-locale override; defaults to the first "# heading" of the document
#   pinned:    true pins the document to the top of the docs list
#   restrict:  asks crawlers to stay away; one value or a list, any combination
#     index        search engines should not index the page (noindex) and the sitemap omits it
#     ai-agents    AI assistants should not fetch the page on behalf of a user
#     ai-training  AI companies should not use the page as training data
#     crawl        crawlers should not fetch the page at all (robots.txt) and the sitemap omits it
#              The page keeps its title, description and social sharing tags. These are requests,
#              not enforcement: a crawler that ignores them is not blocked. "crawl" on its own does
#              not remove a URL that is already indexed, so pair it with "index" for that.
#   banner:    announcement only; pins its title in the site-wide banner
#     tone:      blue (default) | yellow | red
#     versions:  web app versions that see the banner; omit for all versions
#                comparators: <  <=  >  >=  =   separated by spaces, all must match
#                examples: "<1.1.8"   ">1.1.8"   ">=1.0.0 <1.2.0"
#
# The announcement document updates in open pages without a new app version.
# All other documents update with the app.

- slug: announcement
  route: docs
  category: general
  pinned: true
  banner:
    tone: blue
    versions: "<1.1.17"
- slug: model-access
  route: docs
  category: help
- slug: service-access
  route: docs
  category: help
  restrict: index
- slug: abuse-protection
  route: docs
  category: help
- slug: terms
  route: docs
  category: legal
- slug: privacy
  route: docs
  category: legal
- slug: feedback
  route: docs
  category: help
- slug: contribute
  route: contribute
  category: community
- slug: tools
  route: tools
  category: ecosystem
- slug: about
  route: about
  category: general
