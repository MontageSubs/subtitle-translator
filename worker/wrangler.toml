name = "translate"
main = "src/index.ts"
compatibility_date = "2024-11-01"
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
ALLOWED_ORIGIN = "https://subs.js.org"
MAX_BATCH_CHARS = "8000"
MAX_CONTENT_CHARS = "200000"
RATE_LIMIT_UNIT_CHARS = "500"
RISKY_ASNS = "REPLACE_WITH_RISKY_ASNS"
QUARANTINE_BASE_DAYS = "REPLACE_WITH_QUARANTINE_BASE_DAYS"
QUARANTINE_MAX_DAYS = "REPLACE_WITH_QUARANTINE_MAX_DAYS"
DAILY_FREE_QUOTA = "REPLACE_WITH_DAILY_FREE_QUOTA"
DAILY_CAPTCHA_CAP = "REPLACE_WITH_DAILY_CAPTCHA_CAP"
BLOCK_DURATION_DAYS = "REPLACE_WITH_BLOCK_DURATION_DAYS"
MALFORMED_THRESHOLD = "REPLACE_WITH_MALFORMED_THRESHOLD"
HANDSHAKE_ABUSE_THRESHOLD = "REPLACE_WITH_HANDSHAKE_ABUSE_THRESHOLD"
ABUSE_WINDOW_MINUTES = "REPLACE_WITH_ABUSE_WINDOW_MINUTES"
GLOBAL_DAILY_BUDGET = "REPLACE_WITH_GLOBAL_DAILY_BUDGET"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "BURST_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 40, period = 10 }

[[d1_databases]]
binding = "DB"
database_name = "subtitle-translator"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["17 3 * * *"]
