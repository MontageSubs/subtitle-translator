name = "translate"
main = "src/index.ts"
compatibility_date = "2024-11-01"
preview_urls = false

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://subs.js.org"
MAX_BATCH_CHARS = "8000"
MAX_CONTENT_CHARS = "200000"
RATE_LIMIT_UNIT_CHARS = "500"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "BURST_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 40, period = 10 }

[[d1_databases]]
binding = "DB"
database_name = "subtitle-translator"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["17 3 * * *"]
