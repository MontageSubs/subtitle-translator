name = "translate-stats-publisher"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[triggers]
crons = ["1 * * * *"]

[vars]
CF_PAGES_PROJECT = "REPLACE_WITH_PAGES_PROJECT_NAME"
CF_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
ALLOWED_ORIGIN = "https://subs.js.org"
