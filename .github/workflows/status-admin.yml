name: Status Admin Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "1. Action: Select the operation to execute"
        required: true
        type: choice
        options:
          - "Trigger Probe Health Check (trigger_cycle)"
          - "Post Incident / Notice (push_incident)"
          - "Update Incident / Notice (update_incident)"
          - "Resolve Incident (resolve_incident)"
          - "Delete Incident (delete_incident)"
          - "Edit Incident Message (edit_message)"
          - "Delete Incident Message (delete_message)"
          - "Update Daily Snapshot (upsert_snapshot)"
          - "Delete Daily Snapshot (delete_snapshot)"
          - "Clean Expired Records (prune_expired)"
          - "Purge Recent Data (purge_recent)"
          - "Re-render Hardcoded Page (trigger_cycle_hardcoded)"
        default: "Trigger Probe Health Check (trigger_cycle)"
      component_id:
        description: "2. Target Component: Affected service or system component"
        required: false
        type: choice
        options:
          - "Main Site & API Availability (service_availability)"
          - "Core System Infrastructure (core_infrastructure)"
          - "Status Page System (status_system)"
          - "Google Translation PA (google_pa)"
          - "Google Translation V2 (google_v2)"
          - "Microsoft Translator (microsoft_translator)"
          - "DeepL API (deepl_api)"
          - "Cloudflare Edge Network (upstream_cloudflare)"
          - "GitHub Services (upstream_github)"
          - "Google Cloud Infrastructure (upstream_google)"
          - "Azure Cloud Infrastructure (upstream_azure)"
          - "Storage Services (upstream_storage)"
        default: "Main Site & API Availability (service_availability)"
      incident_id:
        description: "3. Incident ID: GUID or leave blank to target component"
        required: false
      message_id:
        description: "4. Message ID: Required for edit_message / delete_message"
        required: false
      date:
        description: "5. Target Date: YYYY-MM-DD for snapshot operations"
        required: false
      status:
        description: "6. Operational Status / Incident State"
        required: false
        type: choice
        options:
          - "🟢 Operational (operational)"
          - "🟡 Degraded Performance (degraded)"
          - "🔴 Service Outage (outage)"
          - "⚪ No Data Available (nodata)"
          - "🔵 Investigating (investigating)"
          - "🟡 Identified (identified)"
          - "🟣 Monitoring (monitoring)"
          - "🟢 Resolved (resolved)"
        default: "🟢 Operational (operational)"
      severity:
        description: "7. Incident Severity: Impact level for incident"
        required: false
        type: choice
        options:
          - "🟡 Minor Impact (minor)"
          - "🟠 Major Impact (major)"
          - "🔴 Critical Outage (critical)"
        default: "🟡 Minor Impact (minor)"
      message:
        description: "8. Update Note: Custom message text shown on status page"
        required: false
      uptime_ratio:
        description: "9. Uptime Ratio: Percent 0-100 (for upsert_snapshot)"
        required: false
      days:
        description: "10. Retention Days: Delete data newer than N days (for purge_recent)"
        required: false
      run_auto_check:
        description: "11. Trigger Probe Cycle: Run health probes after publishing incident"
        required: false
        type: boolean
        default: false
      channel:
        description: "12. Execution Channel: worker (Normal API) | direct (Bypass worker & publish directly)"
        required: true
        type: choice
        options:
          - "Worker API (worker)"
          - "Direct Pages Deploy (direct)"
        default: "Worker API (worker)"

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/status/package-lock.json

      - name: Install status worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - name: Execute admin operation
        env:
          CHANNEL: ${{ contains(inputs.channel, '(direct)') && 'direct' || 'worker' }}
          STATUS_WORKER_URL: ${{ secrets.STATUS_WORKER_URL || secrets.WORKER_URL }}
          TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || secrets.CF_PAGES_PROJECT }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          ISSUE_REPORT_URL: ${{ vars.ISSUE_REPORT_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL }}
          RAW_ACTION: ${{ inputs.action }}
          RAW_COMPONENT_ID: ${{ inputs.component_id }}
          RAW_STATUS_INPUT: ${{ inputs.status }}
          RAW_SEVERITY: ${{ inputs.severity }}
          RAW_INCIDENT_ID: ${{ inputs.incident_id }}
          RAW_MESSAGE_ID: ${{ inputs.message_id }}
          RAW_DATE: ${{ inputs.date }}
          RAW_DAYS: ${{ inputs.days }}
          RAW_UPTIME_RATIO: ${{ inputs.uptime_ratio }}
          RAW_MESSAGE: ${{ inputs.message }}
          RUN_AUTO_CHECK: ${{ inputs.run_auto_check }}
        run: npx --no-install tsx scripts/admin-cli.ts
