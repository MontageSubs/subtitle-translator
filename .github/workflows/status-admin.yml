name: Status Admin Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "1. Action: Select the operation to execute"
        required: true
        type: choice
        options:
          - trigger_cycle
          - trigger_cycle_hardcoded
          - push_incident
          - update_incident
          - resolve_incident
          - delete_incident
          - edit_message
          - delete_message
          - upsert_snapshot
          - delete_snapshot
          - prune_expired
          - purge_recent
        default: trigger_cycle
      component_id:
        description: "2. Target Component: Affected service or system component"
        required: false
        type: choice
        options:
          - service_availability
          - core_infrastructure
          - status_system
          - google_pa
          - google_v2
          - microsoft_translator
          - deepl_api
          - upstream_cloudflare
          - upstream_github
          - upstream_google
          - upstream_azure
          - upstream_storage
        default: service_availability
      incident_id:
        description: "3. Incident ID: GUID or leave blank to auto-generate / target component"
        required: false
      message_id:
        description: "4. Message ID: 12-char hex ID required for edit_message / delete_message"
        required: false
      date:
        description: "5. Target Date: YYYY-MM-DD for delete_snapshot / upsert_snapshot"
        required: false
      status:
        description: "6. Status / State: Operational status or incident workflow state"
        required: false
        type: choice
        options:
          - operational
          - degraded
          - outage
          - nodata
          - investigating
          - identified
          - monitoring
          - resolved
        default: operational
      severity:
        description: "7. Incident Severity: Impact level (push_incident / update_incident)"
        required: false
        type: choice
        options:
          - minor
          - major
          - critical
        default: minor
      message:
        description: "8. Update Note: Custom message text shown on status page"
        required: false
      uptime_ratio:
        description: "9. Uptime Ratio: Percent 0-100 (for upsert_snapshot)"
        required: false
      days:
        description: "10. Retention Days: Delete data newer than N days (for purge_recent)"
        required: false
        default: "1"
      run_auto_check:
        description: "11. Trigger Probe Cycle: Run health probes after publishing incident"
        required: false
        type: boolean
        default: false
      channel:
        description: "12. Execution Channel: worker (Normal API) | direct (Bypass worker & publish directly)"
        required: true
        type: choice
        options:
          - worker
          - direct
        default: worker

permissions:
  contents: read

jobs:
  worker:
    if: ${{ inputs.channel == 'worker' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install status worker dependencies
        run: npm ci

      - name: Execute Admin Operation via Worker API
        env:
          STATUS_WORKER_URL: ${{ secrets.STATUS_WORKER_URL || vars.STATUS_WORKER_URL || secrets.WORKER_URL || vars.WORKER_URL }}
          ADMIN_PATH_SECRET: ${{ secrets.STATUS_ADMIN_PATH_SECRET || vars.STATUS_ADMIN_PATH_SECRET || secrets.ADMIN_PATH_SECRET || vars.ADMIN_PATH_SECRET }}
          TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN || vars.STATUS_ADMIN_TOKEN || secrets.ADMIN_TOKEN || vars.ADMIN_TOKEN }}
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          DATE: ${{ inputs.date }}
          COMPONENT_ID: ${{ inputs.component_id }}
          STATUS_INPUT: ${{ inputs.status }}
          UPTIME_RATIO: ${{ inputs.uptime_ratio }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          SEVERITY: ${{ inputs.severity }}
          MESSAGE: ${{ inputs.message }}
          RUN_AUTO_CHECK: ${{ inputs.run_auto_check }}
        run: |
          set -e

          if [ -z "$STATUS_WORKER_URL" ]; then
            echo "STATUS_WORKER_URL is not configured." >&2
            exit 1
          fi

          if [ -n "$ADMIN_PATH_SECRET" ]; then
            WORKER_ENDPOINT="${STATUS_WORKER_URL%/}/ops-${ADMIN_PATH_SECRET}"
          else
            WORKER_ENDPOINT="${STATUS_WORKER_URL%/}"
          fi

          API_METHOD="POST"
          API_PATH=""
          API_PAYLOAD=""

          json_escape() {
            printf '%s' "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'
          }

          case "$ACTION" in
            trigger_cycle)
              API_PATH="/cycle/trigger"
              API_PAYLOAD='{"mode":"full"}'
              ;;
            trigger_cycle_hardcoded)
              API_PATH="/cycle/trigger"
              API_PAYLOAD='{"mode":"hardcoded"}'
              ;;
            prune_expired)
              API_PATH="/data/prune-expired"
              API_PAYLOAD=""
              ;;
            purge_recent)
              API_PATH="/data/purge"
              API_PAYLOAD="{\"days\": ${DAYS:-1}}"
              ;;
            delete_snapshot)
              if [ -z "$DATE" ]; then
                echo "date is required for delete_snapshot" >&2
                exit 1
              fi
              API_METHOD="DELETE"
              API_PATH="/snapshots"
              if [ -n "$COMPONENT_ID" ]; then
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\"}"
              else
                API_PAYLOAD="{\"date\": \"${DATE}\"}"
              fi
              ;;
            upsert_snapshot)
              if [ -z "$DATE" ] || [ -z "$COMPONENT_ID" ]; then
                echo "date and component_id are required for upsert_snapshot" >&2
                exit 1
              fi
              API_METHOD="PUT"
              API_PATH="/snapshots"
              if [ -n "$UPTIME_RATIO" ]; then
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\", \"uptimeRatio\": ${UPTIME_RATIO}}"
              else
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\"}"
              fi
              ;;
            push_incident | update_incident)
              CLEAN_INC_ID="${INCIDENT_ID#\#}"
              if [ -z "$COMPONENT_ID" ]; then
                echo "component_id is required for $ACTION" >&2
                exit 1
              fi
              if [ "$ACTION" = "update_incident" ] && [ -z "$CLEAN_INC_ID" ]; then
                echo "incident_id is required for update_incident" >&2
                exit 1
              fi
              mode="new"
              [ "$ACTION" = "update_incident" ] && mode="update"
              msg_json="null"
              [ -n "$MESSAGE" ] && msg_json=$(json_escape "$MESSAGE")
              inc_field=""
              [ -n "$CLEAN_INC_ID" ] && inc_field=", \"incidentId\": \"${CLEAN_INC_ID}\""
              auto_check="false"
              [ "$RUN_AUTO_CHECK" = "true" ] && auto_check="true"
              API_PATH="/incidents"
              API_PAYLOAD="{\"mode\": \"${mode}\", \"componentId\": \"${COMPONENT_ID}\", \"severity\": \"${SEVERITY}\", \"status\": \"${STATUS_INPUT}\", \"message\": ${msg_json}, \"runAutoCheck\": ${auto_check}${inc_field}}"
              ;;
            resolve_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id or component_id is required for resolve_incident" >&2
                exit 1
              fi
              API_PATH="/incidents/resolve"
              API_PAYLOAD="{\"incidentId\": \"${TARGET_ID}\"}"
              ;;
            delete_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id or component_id is required for delete_incident" >&2
                exit 1
              fi
              API_PATH="/incidents/delete"
              API_PAYLOAD="{\"incidentId\": \"${TARGET_ID}\"}"
              ;;
            edit_message)
              TARGET_MSG_ID="${MESSAGE_ID:-$INCIDENT_ID}"
              TARGET_MSG_ID="${TARGET_MSG_ID#\#}"
              if [ -z "$TARGET_MSG_ID" ]; then
                echo "message_id is required for edit_message" >&2
                exit 1
              fi
              msg_json="null"
              [ -n "$MESSAGE" ] && msg_json=$(json_escape "$MESSAGE")
              API_PATH="/messages/edit"
              API_PAYLOAD="{\"messageId\": \"${TARGET_MSG_ID}\", \"body\": ${msg_json}, \"status\": \"${STATUS_INPUT}\"}"
              ;;
            delete_message)
              TARGET_MSG_ID="${MESSAGE_ID:-$INCIDENT_ID}"
              TARGET_MSG_ID="${TARGET_MSG_ID#\#}"
              if [ -z "$TARGET_MSG_ID" ]; then
                echo "message_id is required for delete_message" >&2
                exit 1
              fi
              API_PATH="/messages/delete"
              API_PAYLOAD="{\"messageId\": \"${TARGET_MSG_ID}\"}"
              ;;
            *)
              echo "Unknown action: $ACTION" >&2
              exit 1
              ;;
          esac

          echo "Attempting Worker API call to ${WORKER_ENDPOINT}${API_PATH}..."
          resp=""
          if [ -n "$API_PAYLOAD" ]; then
            resp=$(curl -sS -w "\n%{http_code}" -X "$API_METHOD" "${WORKER_ENDPOINT}${API_PATH}" \
              -A "Status-Admin-Ops/2.0" \
              -H "X-Gateway-Automation-Token: ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$API_PAYLOAD" || true)
          else
            resp=$(curl -sS -w "\n%{http_code}" -X "$API_METHOD" "${WORKER_ENDPOINT}${API_PATH}" \
              -A "Status-Admin-Ops/2.0" \
              -H "X-Gateway-Automation-Token: ${TOKEN}" || true)
          fi

          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "Worker API HTTP Code: $code"
          echo "Worker API Response: $body"

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Worker API call succeeded!"
          else
            echo "Worker API call failed with status code $code" >&2
            exit 1
          fi

  direct:
    if: ${{ inputs.channel == 'direct' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject unsupported actions on the direct channel
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            trigger_cycle_hardcoded|push_incident|update_incident|resolve_incident|delete_incident|edit_message|delete_message) ;;
            *)
              echo "The direct channel only supports trigger_cycle_hardcoded, push_incident, update_incident, resolve_incident, delete_incident, edit_message, delete_message (probe-driven actions need the worker itself)." >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install status worker dependencies
        run: npm ci

      - name: Publish directly to Cloudflare Pages
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          ISSUE_REPORT_URL: ${{ vars.ISSUE_REPORT_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL }}
          MODE: ${{ inputs.action == 'trigger_cycle_hardcoded' && 'hardcoded' || inputs.action == 'resolve_incident' && 'resolve_incident' || inputs.action == 'delete_incident' && 'delete_incident' || inputs.action == 'edit_message' && 'edit_message' || inputs.action == 'delete_message' && 'delete_message' || 'push_incident' }}
          INCIDENT_MODE: ${{ inputs.action == 'update_incident' && 'update' || 'new' }}
          COMPONENT_ID: ${{ inputs.component_id }}
          INCIDENT_ID: ${{ inputs.incident_id || inputs.component_id }}
          MESSAGE_ID: ${{ inputs.message_id || inputs.incident_id }}
          SEVERITY: ${{ inputs.severity }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
        run: npx tsx scripts/direct-publish.ts

