name: Status Admin Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation"
        required: true
        type: choice
        options:
          - trigger_cycle
          - trigger_cycle_hardcoded
          - prune_expired
          - purge_recent
          - delete_snapshot
          - upsert_snapshot
          - push_incident
          - update_incident
          - resolve_incident
          - delete_incident
        default: trigger_cycle
      days:
        description: "purge_recent: delete data newer than N days"
        required: false
        default: "1"
      date:
        description: "delete_snapshot / upsert_snapshot: target date (YYYY-MM-DD)"
        required: false
      component_id:
        description: "Target component for snapshot/incident operations"
        required: false
        type: choice
        options:
          - service_availability
          - core_infrastructure
          - status_system
          - google_pa
          - google_v2
          - microsoft_translator
          - deepl_api
          - upstream_cloudflare
          - upstream_github
          - upstream_google
          - upstream_azure
          - upstream_storage
        default: service_availability
      status:
        description: "upsert_snapshot: operational | degraded | outage | nodata. push_incident/update_incident: investigating | identified | monitoring | resolved"
        required: false
        type: choice
        options:
          - operational
          - degraded
          - outage
          - nodata
          - investigating
          - identified
          - monitoring
          - resolved
        default: operational
      uptime_ratio:
        description: "upsert_snapshot: 0-100, defaults based on status if left blank"
        required: false
      incident_id:
        description: "Incident ID (Leave blank to auto-generate a new ID; or fill in an existing ID to update/overwrite/delete it)"
        required: false
      severity:
        description: "push_incident / update_incident: minor | major | critical"
        required: false
        type: choice
        options:
          - minor
          - major
          - critical
        default: minor
      message:
        description: "push_incident / update_incident: incident text shown to visitors. Leave blank to use a default template for the chosen status"
        required: false
      run_auto_check:
        description: "push_incident / update_incident: also run a full probe cycle after publishing this incident"
        required: false
        type: boolean
        default: false
      channel:
        description: "worker (default, normal path) | direct (bypass the worker and publish to Pages directly — only for use when the worker itself is down; supports trigger_cycle_hardcoded, push_incident, update_incident, resolve_incident)"
        required: false
        type: choice
        options:
          - worker
          - direct
        default: worker

permissions:
  contents: read

jobs:
  via-worker:
    if: ${{ inputs.channel == 'worker' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve admin base URL
        id: resolve
        env:
          STATUS_WORKER_URL: ${{ secrets.STATUS_WORKER_URL || vars.STATUS_WORKER_URL || secrets.WORKER_URL || vars.WORKER_URL }}
          ADMIN_PATH_SECRET: ${{ secrets.STATUS_ADMIN_PATH_SECRET || vars.STATUS_ADMIN_PATH_SECRET || secrets.ADMIN_PATH_SECRET || vars.ADMIN_PATH_SECRET }}
        run: |
          if [ -z "$STATUS_WORKER_URL" ]; then
            echo "STATUS_WORKER_URL is not configured as a repository/organization secret or variable." >&2
            exit 1
          fi
          if [ -n "$ADMIN_PATH_SECRET" ]; then
            echo "url=${STATUS_WORKER_URL%/}/ops-${ADMIN_PATH_SECRET}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${STATUS_WORKER_URL%/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Call admin API
        env:
          TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN || vars.STATUS_ADMIN_TOKEN || secrets.ADMIN_TOKEN || vars.ADMIN_TOKEN }}
          BASE_URL: ${{ steps.resolve.outputs.url }}
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          DATE: ${{ inputs.date }}
          COMPONENT_ID: ${{ inputs.component_id }}
          STATUS_INPUT: ${{ inputs.status }}
          UPTIME_RATIO: ${{ inputs.uptime_ratio }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          SEVERITY: ${{ inputs.severity }}
          MESSAGE: ${{ inputs.message }}
          RUN_AUTO_CHECK: ${{ inputs.run_auto_check }}
        run: |
          set -e

          call() {
            local method="$1" path="$2" payload="$3"
            local resp code body
            if [ -n "$payload" ]; then
              resp=$(curl -sS -w "\n%{http_code}" -X "$method" "${BASE_URL}${path}" \
                -A "Status-Admin-Ops/2.0" \
                -H "X-Gateway-Automation-Token: ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$payload")
            else
              resp=$(curl -sS -w "\n%{http_code}" -X "$method" "${BASE_URL}${path}" \
                -A "Status-Admin-Ops/2.0" \
                -H "X-Gateway-Automation-Token: ${TOKEN}")
            fi
            body=$(echo "$resp" | head -n -1)
            code=$(echo "$resp" | tail -n 1)
            echo "HTTP Code: $code"
            echo "Response: $body"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              exit 1
            fi
          }

          json_escape() {
            printf '%s' "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'
          }

          case "$ACTION" in
            trigger_cycle)
              call POST /cycle/trigger '{"mode":"full"}'
              ;;

            trigger_cycle_hardcoded)
              call POST /cycle/trigger '{"mode":"hardcoded"}'
              ;;

            prune_expired)
              call POST /data/prune-expired ""
              ;;

            purge_recent)
              call POST /data/purge "{\"days\": ${DAYS}}"
              ;;

            delete_snapshot)
              if [ -z "$DATE" ]; then
                echo "date is required for delete_snapshot" >&2
                exit 1
              fi
              if [ -n "$COMPONENT_ID" ]; then
                payload="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\"}"
              else
                payload="{\"date\": \"${DATE}\"}"
              fi
              call DELETE /snapshots "$payload"
              ;;

            upsert_snapshot)
              if [ -z "$DATE" ] || [ -z "$COMPONENT_ID" ]; then
                echo "date and component_id are required for upsert_snapshot" >&2
                exit 1
              fi
              if [ -n "$UPTIME_RATIO" ]; then
                payload="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\", \"uptimeRatio\": ${UPTIME_RATIO}}"
              else
                payload="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\"}"
              fi
              call PUT /snapshots "$payload"
              ;;

            push_incident | update_incident)
              INCIDENT_ID="${INCIDENT_ID#\#}"
              if [ -z "$COMPONENT_ID" ]; then
                echo "component_id is required for $ACTION" >&2
                exit 1
              fi
              if [ "$ACTION" = "update_incident" ] && [ -z "$INCIDENT_ID" ]; then
                echo "incident_id is required for update_incident" >&2
                exit 1
              fi
              mode="new"
              [ "$ACTION" = "update_incident" ] && mode="update"
              msg_json="null"
              [ -n "$MESSAGE" ] && msg_json=$(json_escape "$MESSAGE")
              incident_id_field=""
              [ -n "$INCIDENT_ID" ] && incident_id_field=", \"incidentId\": \"${INCIDENT_ID}\""
              auto_check="false"
              [ "$RUN_AUTO_CHECK" = "true" ] && auto_check="true"
              payload="{\"mode\": \"${mode}\", \"componentId\": \"${COMPONENT_ID}\", \"severity\": \"${SEVERITY}\", \"status\": \"${STATUS_INPUT}\", \"message\": ${msg_json}, \"runAutoCheck\": ${auto_check}${incident_id_field}}"
              call POST /incidents "$payload"
              ;;

            resolve_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id or component_id is required for resolve_incident" >&2
                exit 1
              fi
              call POST /incidents/resolve "{\"incidentId\": \"${TARGET_ID}\"}"
              ;;

            delete_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id is required for delete_incident" >&2
                exit 1
              fi
              call POST /incidents/delete "{\"incidentId\": \"${TARGET_ID}\"}"
              ;;

            *)
              echo "Unknown action: $ACTION" >&2
              exit 1
              ;;
          esac

  direct:
    if: ${{ inputs.channel == 'direct' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/status
    steps:
      - name: Reject unsupported actions on the direct channel
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            trigger_cycle_hardcoded|push_incident|update_incident|resolve_incident|delete_incident) ;;
            *)
              echo "The direct channel only supports trigger_cycle_hardcoded, push_incident, update_incident, resolve_incident (probe-driven actions need the worker itself)." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Publish directly to Cloudflare Pages
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          ISSUE_REPORT_URL: ${{ vars.ISSUE_REPORT_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL }}
          MODE: ${{ inputs.action == 'trigger_cycle_hardcoded' && 'hardcoded' || inputs.action == 'resolve_incident' && 'resolve_incident' || inputs.action == 'delete_incident' && 'delete_incident' || 'push_incident' }}
          INCIDENT_MODE: ${{ inputs.action == 'update_incident' && 'update' || 'new' }}
          COMPONENT_ID: ${{ inputs.component_id }}
          INCIDENT_ID: ${{ inputs.incident_id || inputs.component_id }}
          SEVERITY: ${{ inputs.severity }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
        run: npx tsx scripts/direct-publish.ts
