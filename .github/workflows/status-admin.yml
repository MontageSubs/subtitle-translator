name: Status Admin Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "1. Action: Select the operation to execute"
        required: true
        type: choice
        options:
          - "⚡ Trigger Probe Health Check (trigger_cycle)"
          - "📌 Post Incident / Notice (push_incident)"
          - "✏️ Update Incident / Notice (update_incident)"
          - "✅ Resolve Incident (resolve_incident)"
          - "🗑️ Delete Incident (delete_incident)"
          - "📝 Edit Incident Message (edit_message)"
          - "❌ Delete Incident Message (delete_message)"
          - "📊 Update Daily Snapshot (upsert_snapshot)"
          - "🗑️ Delete Daily Snapshot (delete_snapshot)"
          - "🧹 Clean Expired Records (prune_expired)"
          - "⚠️ Purge Recent Data (purge_recent)"
          - "🔄 Re-render Hardcoded Page (trigger_cycle_hardcoded)"
        default: "⚡ Trigger Probe Health Check (trigger_cycle)"
      component_id:
        description: "2. Target Component: Affected service or system component"
        required: false
        type: choice
        options:
          - "🌐 Main Site & API Availability (service_availability)"
          - "⚙️ Core System Infrastructure (core_infrastructure)"
          - "📊 Status Page System (status_system)"
          - "☁️ Google Translation PA (google_pa)"
          - "☁️ Google Translation V2 (google_v2)"
          - "🔷 Microsoft Translator (microsoft_translator)"
          - "🔶 DeepL API (deepl_api)"
          - "🌩️ Cloudflare Edge Network (upstream_cloudflare)"
          - "🐙 GitHub Services (upstream_github)"
          - "🔍 Google Cloud Infrastructure (upstream_google)"
          - "💻 Azure Cloud Infrastructure (upstream_azure)"
          - "💾 Storage Services (upstream_storage)"
        default: "🌐 Main Site & API Availability (service_availability)"
      incident_id:
        description: "3. Incident ID: GUID or leave blank to target component"
        required: false
      message_id:
        description: "4. Message ID: Required for edit_message / delete_message"
        required: false
      date:
        description: "5. Target Date: YYYY-MM-DD for snapshot operations"
        required: false
      status:
        description: "6. Operational Status / Incident State"
        required: false
        type: choice
        options:
          - "🟢 Operational (operational)"
          - "🟡 Degraded Performance (degraded)"
          - "🔴 Service Outage (outage)"
          - "⚪ No Data Available (nodata)"
          - "🔍 Investigating Issue (investigating)"
          - "🎯 Issue Identified (identified)"
          - "📈 Monitoring Fix (monitoring)"
          - "✅ Resolved (resolved)"
        default: "🟢 Operational (operational)"
      severity:
        description: "7. Incident Severity: Impact level for incident"
        required: false
        type: choice
        options:
          - "🟡 Minor Impact (minor)"
          - "🟠 Major Impact (major)"
          - "🔴 Critical Outage (critical)"
        default: "🟡 Minor Impact (minor)"
      message:
        description: "8. Update Note: Custom message text shown on status page"
        required: false
      uptime_ratio:
        description: "9. Uptime Ratio: Percent 0-100 (for upsert_snapshot)"
        required: false
      days:
        description: "10. Retention Days: Delete data newer than N days (for purge_recent)"
        required: false
      run_auto_check:
        description: "11. Trigger Probe Cycle: Run health probes after publishing incident"
        required: false
        type: boolean
        default: false
      channel:
        description: "12. Execution Channel: worker (Normal API) | direct (Bypass worker & publish directly)"
        required: true
        type: choice
        options:
          - "🚀 Worker API (worker - Standard Backend)"
          - "⚡ Direct Pages Deploy (direct - Bypass Worker)"
        default: "🚀 Worker API (worker - Standard Backend)"

permissions:
  contents: read

jobs:
  worker:
    if: ${{ contains(inputs.channel, 'worker') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Execute Admin Operation via Worker API
        env:
          STATUS_WORKER_URL: ${{ secrets.STATUS_WORKER_URL || secrets.WORKER_URL }}
          ADMIN_PATH_SECRET: ${{ secrets.STATUS_ADMIN_PATH_SECRET || secrets.ADMIN_PATH_SECRET }}
          TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          RAW_ACTION: ${{ inputs.action }}
          RAW_DAYS: ${{ inputs.days }}
          RAW_DATE: ${{ inputs.date }}
          RAW_COMPONENT_ID: ${{ inputs.component_id }}
          RAW_STATUS_INPUT: ${{ inputs.status }}
          RAW_UPTIME_RATIO: ${{ inputs.uptime_ratio }}
          RAW_INCIDENT_ID: ${{ inputs.incident_id }}
          RAW_MESSAGE_ID: ${{ inputs.message_id }}
          RAW_SEVERITY: ${{ inputs.severity }}
          RAW_MESSAGE: ${{ inputs.message }}
          RUN_AUTO_CHECK: ${{ inputs.run_auto_check }}
        run: |
          set -e

          if [ -z "$STATUS_WORKER_URL" ]; then
            echo "STATUS_WORKER_URL secret is not configured." >&2
            exit 1
          fi

          echo "::add-mask::$STATUS_WORKER_URL"
          [ -n "$ADMIN_PATH_SECRET" ] && echo "::add-mask::$ADMIN_PATH_SECRET"
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"

          parse_choice() {
            val="$1"
            if [[ "$val" =~ \(([^)]+)\)$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo "$val"
            fi
          }

          ACTION=$(parse_choice "${RAW_ACTION}")
          COMPONENT_ID=$(parse_choice "${RAW_COMPONENT_ID}")
          STATUS_INPUT=$(parse_choice "${RAW_STATUS_INPUT}")
          SEVERITY=$(parse_choice "${RAW_SEVERITY}")
          DAYS="${RAW_DAYS:-1}"
          DATE="${RAW_DATE}"
          UPTIME_RATIO="${RAW_UPTIME_RATIO}"
          INCIDENT_ID="${RAW_INCIDENT_ID}"
          MESSAGE_ID="${RAW_MESSAGE_ID}"
          MESSAGE="${RAW_MESSAGE}"

          if [ -n "$ADMIN_PATH_SECRET" ]; then
            WORKER_ENDPOINT="${STATUS_WORKER_URL%/}/ops-${ADMIN_PATH_SECRET}"
          else
            WORKER_ENDPOINT="${STATUS_WORKER_URL%/}"
          fi

          API_METHOD="POST"
          API_PATH=""
          API_PAYLOAD=""

          json_escape() {
            printf '%s' "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'
          }

          case "$ACTION" in
            trigger_cycle)
              API_PATH="/cycle/trigger"
              API_PAYLOAD='{"mode":"full"}'
              ;;
            trigger_cycle_hardcoded)
              API_PATH="/cycle/trigger"
              API_PAYLOAD='{"mode":"hardcoded"}'
              ;;
            prune_expired)
              API_PATH="/data/prune-expired"
              API_PAYLOAD=""
              ;;
            purge_recent)
              API_PATH="/data/purge"
              DAYS=$(echo "$DAYS" | tr -cd '0-9')
              DAYS="${DAYS:-1}"
              API_PAYLOAD="{\"days\": ${DAYS}}"
              ;;
            delete_snapshot)
              if [ -z "$DATE" ]; then
                echo "date is required for delete_snapshot" >&2
                exit 1
              fi
              DATE=$(echo "$DATE" | tr -cd '0-9-')
              API_METHOD="DELETE"
              API_PATH="/snapshots"
              if [ -n "$COMPONENT_ID" ]; then
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\"}"
              else
                API_PAYLOAD="{\"date\": \"${DATE}\"}"
              fi
              ;;
            upsert_snapshot)
              if [ -z "$DATE" ] || [ -z "$COMPONENT_ID" ]; then
                echo "date and component_id are required for upsert_snapshot" >&2
                exit 1
              fi
              DATE=$(echo "$DATE" | tr -cd '0-9-')
              API_METHOD="PUT"
              API_PATH="/snapshots"
              if [ -n "$UPTIME_RATIO" ]; then
                CLEAN_RATIO=$(echo "$UPTIME_RATIO" | tr -cd '0-9.')
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\", \"uptimeRatio\": ${CLEAN_RATIO}}"
              else
                API_PAYLOAD="{\"date\": \"${DATE}\", \"componentId\": \"${COMPONENT_ID}\", \"status\": \"${STATUS_INPUT}\"}"
              fi
              ;;
            push_incident | update_incident)
              CLEAN_INC_ID="${INCIDENT_ID#\#}"
              CLEAN_INC_ID=$(echo "$CLEAN_INC_ID" | tr -cd 'a-zA-Z0-9_-')
              if [ -z "$COMPONENT_ID" ]; then
                echo "component_id is required for $ACTION" >&2
                exit 1
              fi
              if [ "$ACTION" = "update_incident" ] && [ -z "$CLEAN_INC_ID" ]; then
                echo "incident_id is required for update_incident" >&2
                exit 1
              fi
              mode="new"
              [ "$ACTION" = "update_incident" ] && mode="update"
              msg_json="null"
              [ -n "$MESSAGE" ] && msg_json=$(json_escape "$MESSAGE")
              inc_field=""
              [ -n "$CLEAN_INC_ID" ] && inc_field=", \"incidentId\": \"${CLEAN_INC_ID}\""
              auto_check="false"
              [ "$RUN_AUTO_CHECK" = "true" ] && auto_check="true"
              API_PATH="/incidents"
              API_PAYLOAD="{\"mode\": \"${mode}\", \"componentId\": \"${COMPONENT_ID}\", \"severity\": \"${SEVERITY}\", \"status\": \"${STATUS_INPUT}\", \"message\": ${msg_json}, \"runAutoCheck\": ${auto_check}${inc_field}}"
              ;;
            resolve_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              TARGET_ID=$(echo "$TARGET_ID" | tr -cd 'a-zA-Z0-9_-')
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id or component_id is required for resolve_incident" >&2
                exit 1
              fi
              API_PATH="/incidents/resolve"
              API_PAYLOAD="{\"incidentId\": \"${TARGET_ID}\"}"
              ;;
            delete_incident)
              TARGET_ID="${INCIDENT_ID:-$COMPONENT_ID}"
              TARGET_ID="${TARGET_ID#\#}"
              TARGET_ID=$(echo "$TARGET_ID" | tr -cd 'a-zA-Z0-9_-')
              if [ -z "$TARGET_ID" ]; then
                echo "incident_id or component_id is required for delete_incident" >&2
                exit 1
              fi
              API_PATH="/incidents/delete"
              API_PAYLOAD="{\"incidentId\": \"${TARGET_ID}\"}"
              ;;
            edit_message)
              TARGET_MSG_ID="${MESSAGE_ID:-$INCIDENT_ID}"
              TARGET_MSG_ID="${TARGET_MSG_ID#\#}"
              TARGET_MSG_ID=$(echo "$TARGET_MSG_ID" | tr -cd 'a-zA-Z0-9_-')
              if [ -z "$TARGET_MSG_ID" ]; then
                echo "message_id is required for edit_message" >&2
                exit 1
              fi
              msg_json="null"
              [ -n "$MESSAGE" ] && msg_json=$(json_escape "$MESSAGE")
              API_PATH="/messages/edit"
              API_PAYLOAD="{\"messageId\": \"${TARGET_MSG_ID}\", \"body\": ${msg_json}, \"status\": \"${STATUS_INPUT}\"}"
              ;;
            delete_message)
              TARGET_MSG_ID="${MESSAGE_ID:-$INCIDENT_ID}"
              TARGET_MSG_ID="${TARGET_MSG_ID#\#}"
              TARGET_MSG_ID=$(echo "$TARGET_MSG_ID" | tr -cd 'a-zA-Z0-9_-')
              if [ -z "$TARGET_MSG_ID" ]; then
                echo "message_id is required for delete_message" >&2
                exit 1
              fi
              API_PATH="/messages/delete"
              API_PAYLOAD="{\"messageId\": \"${TARGET_MSG_ID}\"}"
              ;;
            *)
              echo "Unknown action: $ACTION" >&2
              exit 1
              ;;
          esac

          echo "Dispatching Admin API request: ${API_METHOD} ${API_PATH}"
          resp=""
          if [ -n "$API_PAYLOAD" ]; then
            resp=$(curl -sS -w "\n%{http_code}" -X "$API_METHOD" "${WORKER_ENDPOINT}${API_PATH}" \
              -A "Status-Admin-Ops/2.0" \
              -H "X-Gateway-Automation-Token: ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$API_PAYLOAD" || true)
          else
            resp=$(curl -sS -w "\n%{http_code}" -X "$API_METHOD" "${WORKER_ENDPOINT}${API_PATH}" \
              -A "Status-Admin-Ops/2.0" \
              -H "X-Gateway-Automation-Token: ${TOKEN}" || true)
          fi

          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "Worker API HTTP Code: $code"
          echo "Worker API Response: $body"

          if [ -n "$code" ] && [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then
            echo "Worker API call succeeded!"
          else
            echo "Worker API call failed with status code ${code:-unknown}" >&2
            exit 1
          fi

  direct:
    if: ${{ contains(inputs.channel, 'direct') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and parse input options
        env:
          RAW_ACTION: ${{ inputs.action }}
        run: |
          parse_choice() {
            val="$1"
            if [[ "$val" =~ \(([^)]+)\)$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo "$val"
            fi
          }
          ACTION=$(parse_choice "${RAW_ACTION}")
          case "$ACTION" in
            trigger_cycle_hardcoded|push_incident|update_incident|resolve_incident|delete_incident|edit_message|delete_message|upsert_snapshot|delete_snapshot) ;;
            *)
              echo "The direct channel supports incidents, snapshots, and static re-renders (probe-driven actions like trigger_cycle require the worker channel)." >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/status/package-lock.json

      - name: Install status worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - name: Publish directly to Cloudflare Pages
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || secrets.CF_PAGES_PROJECT }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          ISSUE_REPORT_URL: ${{ vars.ISSUE_REPORT_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL }}
          RAW_ACTION: ${{ inputs.action }}
          RAW_COMPONENT_ID: ${{ inputs.component_id }}
          RAW_STATUS_INPUT: ${{ inputs.status }}
          RAW_SEVERITY: ${{ inputs.severity }}
          RAW_INCIDENT_ID: ${{ inputs.incident_id }}
          RAW_MESSAGE_ID: ${{ inputs.message_id }}
          RAW_DATE: ${{ inputs.date }}
          RAW_UPTIME_RATIO: ${{ inputs.uptime_ratio }}
          MESSAGE: ${{ inputs.message }}
        run: |
          parse_choice() {
            val="$1"
            if [[ "$val" =~ \(([^)]+)\)$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo "$val"
            fi
          }
          export MODE=$(parse_choice "${RAW_ACTION}")
          export COMPONENT_ID=$(parse_choice "${RAW_COMPONENT_ID}")
          export STATUS=$(parse_choice "${RAW_STATUS_INPUT}")
          export SEVERITY=$(parse_choice "${RAW_SEVERITY}")
          export INCIDENT_MODE=$([ "$MODE" = "update_incident" ] && echo "update" || echo "new")
          export INCIDENT_ID="${RAW_INCIDENT_ID}"
          export MESSAGE_ID="${RAW_MESSAGE_ID}"
          export DATE="${RAW_DATE}"
          export UPTIME_RATIO="${RAW_UPTIME_RATIO}"

          npx --no-install tsx scripts/direct-publish.ts

