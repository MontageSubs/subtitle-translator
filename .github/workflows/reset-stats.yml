name: Reset / Init Stats DB

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm (new DB: initialize tables; existing DB: clear all stats, irreversible)'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "RESET" ]; then
            echo "confirmation text mismatch, aborting" >&2
            exit 1
          fi

      - name: Ensure schema and clear rows
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_AUTH_TOKEN: ${{ secrets.TURSO_WRITE_AUTH_TOKEN }}
        run: |
          set -e
          url="$(echo "$TURSO_URL" | sed -e 's#^libsql://#https://#' -e 's#/*$##')/v2/pipeline"
          curl -sf -X POST "$url" \
            -H "Authorization: Bearer $TURSO_WRITE_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"requests":[
              {"type":"execute","stmt":{"sql":"CREATE TABLE IF NOT EXISTS translation_stats_hourly (bucket_start INTEGER PRIMARY KEY, count INTEGER NOT NULL)"}},
              {"type":"execute","stmt":{"sql":"DELETE FROM translation_stats_hourly"}},
              {"type":"close"}
            ]}'
          echo "translation_stats_hourly ready and cleared"
