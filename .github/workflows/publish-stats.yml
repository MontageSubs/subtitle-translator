name: Publish Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VITE_STATS_URL: ${{ vars.STATS_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Pages project name
        run: |
          PROJECT_NAME=$(echo "$VITE_STATS_URL" | sed -E 's#^https?://([^./]+)\..*$#\1#')
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - run: node scripts/publish-stats.mjs

      - run: npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch=main
