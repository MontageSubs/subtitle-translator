name: Deploy Status Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/status/**"
      - ".github/workflows/deploy-status.yml"
      - ".github/workflows/scripts/deploy-status.sh"
      - ".github/workflows/scripts/prepare-status-deploy.py"
      - ".github/workflows/scripts/trigger-status-cycle.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/status
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/status/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - run: npm run typecheck

      - name: Deploy status worker to Cloudflare
        id: deploy_worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_PAGES_PROJECT_VAR: ${{ vars.CF_PAGES_PROJECT || secrets.CF_PAGES_PROJECT }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL || secrets.MAIN_SITE_URL }}
          ISSUE_REPORT_URL: ${{ vars.ISSUE_REPORT_URL || secrets.ISSUE_REPORT_URL }}
          GITHUB_REPO_URL: ${{ vars.GITHUB_REPO_URL || secrets.GITHUB_REPO_URL }}
          STATUS_URL: ${{ vars.STATUS_URL || secrets.STATUS_URL }}
          CRON_SCHEDULE: ${{ vars.CRON_SCHEDULE || secrets.CRON_SCHEDULE }}
          DEBUG: ${{ vars.DEBUG }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_API_SECRET: ${{ secrets.STATUS_ADMIN_TOKEN }}
          STATUS_WORKER_URL: ${{ secrets.STATUS_WORKER_URL || secrets.WORKER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: bash ../../.github/workflows/scripts/deploy-status.sh

      - name: Trigger initial status cycle
        env:
          TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url || secrets.STATUS_WORKER_URL || secrets.WORKER_URL }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/trigger-status-cycle.sh"
