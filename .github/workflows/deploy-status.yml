name: Deploy Status Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/status/**"
      - ".github/workflows/deploy-status.yml"
      - ".github/workflows/scripts/deploy-status.sh"
      - ".github/workflows/scripts/config.py"
      - ".github/config/manifest.json"
      - ".github/workflows/scripts/trigger-status-cycle.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/status
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/status/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - run: npm run typecheck

      - name: Detect status-worker changes
        if: github.event_name == 'push'
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- .; then
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and commit patch version (before deploy, skipped if a human already changed it in this push, or if only deployment files changed)
        if: github.event_name == 'push' && steps.changes.outputs.worker_changed == 'true'
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          bash ../../.github/workflows/scripts/bump-and-commit.sh src/version.ts 'STATUS_WORKER_VERSION = "([^"]+)"' "update: status v" "${{ github.event.before }}" "${{ github.sha }}"

      - name: Deploy status worker to Cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
          DOMAIN: ${{ vars.DOMAIN }}
          SITE: ${{ vars.SITE }}
          CF_NAMES: ${{ vars.CF_NAMES }}
          ST_RUNTIME: ${{ vars.ST_RUNTIME }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN_WORKERS: ${{ secrets.CF_TOKEN_WORKERS }}
          CF_TOKEN_STATUS: ${{ secrets.CF_TOKEN_STATUS }}
          DB_TURSO_URL: ${{ secrets.DB_TURSO_URL }}
          DB_TURSO_TOKEN: ${{ secrets.DB_TURSO_TOKEN }}
          ST_ADMIN_TOKEN: ${{ secrets.ST_ADMIN_TOKEN }}
        run: bash ../../.github/workflows/scripts/deploy-status.sh

      - name: Trigger initial status cycle
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ST_ADMIN_TOKEN: ${{ secrets.ST_ADMIN_TOKEN }}
          PROPAGATION_WAIT_SECONDS: "20"
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/trigger-status-cycle.sh"
