name: Deploy Status Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/status/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/status/package-lock.json

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          ST_CONFIG: ${{ secrets.ST_CONFIG }}
          CF_TOKEN_WORKERS: ${{ secrets.CF_TOKEN_WORKERS }}
          CF_TOKEN_STATUS: ${{ secrets.CF_TOKEN_STATUS }}
          DB_TURSO_URL: ${{ secrets.DB_TURSO_URL }}
          DB_TURSO_TOKEN: ${{ secrets.DB_TURSO_TOKEN }}
          ST_ADMIN_TOKEN: ${{ secrets.ST_ADMIN_TOKEN }}
          ST_GATE_TOKEN: ${{ secrets.ST_GATE_TOKEN }}
        run: bash .github/workflows/scripts/deploy-status.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}"
