name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Bump and commit patch version (before build, skipped if a human already changed it in this push)
        if: github.event_name == 'push'
        run: |
          set -e
          BEFORE_VERSION=$(grep -o 'app-version" content="[^"]*"' index.html)
          node ../scripts/bump-patch-version.mjs index.html 'app-version" content="([^"]+)"' "${{ github.event.before }}"
          AFTER_VERSION=$(grep -o 'app-version" content="[^"]*"' index.html)
          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            VERSION_VAL=$(sed -n 's/.*app-version" content="\([^"]*\)".*/\1/p' index.html)
            AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
            AUTHOR_EMAIL="${{ github.event.head_commit.author.email }}"
            if [ -z "$AUTHOR_NAME" ]; then AUTHOR_NAME="${{ github.actor }}"; fi
            if [ -z "$AUTHOR_EMAIL" ]; then AUTHOR_EMAIL="${{ github.actor }}@users.noreply.github.com"; fi
            git config user.name "montagesubs-bot"
            git config user.email "montagesubs-bot@users.noreply.github.com"
            git add index.html
            git commit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" -m "update: page v${VERSION_VAL}"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || {
                if [ $i -eq 5 ]; then
                  echo "Failed to push version bump after 5 attempts" >&2
                  exit 1
                fi
                sleep $((i * 2))
              }
            done
          fi

      - name: Build
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
