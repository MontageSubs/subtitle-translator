name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "app/**"
      - "docs/**"
      - "!docs/github/**"
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Bump the patch version of the selected branch before deploying"
        type: boolean
        default: false
      force_runtime:
        description: "Redeploy the runtime assets project even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=$(bash .github/workflows/scripts/should-deploy-pages.sh "${{ github.event.before }}" "${{ github.sha }}")" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && (github.event_name == 'push' || inputs.bump_version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump and commit patch version (skipped if a human already changed it in this push, or if app/ is untouched)
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: bash .github/workflows/scripts/bump-app-version.sh "${{ github.event.before }}" "${{ github.sha }}"

  relay:
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.outputs.deploy == 'true' && needs.bump.result != 'failure' && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deploy from main, the only branch the github-pages environment accepts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref main

  release:
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.outputs.deploy == 'true' && needs.bump.result != 'failure' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      beta_outcome: ${{ steps.beta_build.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 0

      - id: channels
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.channels.outputs.beta == 'true'
        with:
          ref: beta
          path: beta
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/app/package-lock.json
            beta/app/package-lock.json

      - name: Build production
        working-directory: main/app
        env:
          APP_CHANNEL: production
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_REPO_BRANCH: ${{ github.event.repository.default_branch }}
          VITE_RUNTIME_SOURCES: ${{ vars.RUNTIME_SOURCES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export APP_BUILD_ID="$(git rev-parse --short HEAD)"
          npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000
          npm run build

      - name: Build beta
        id: beta_build
        if: steps.channels.outputs.beta == 'true'
        continue-on-error: true
        working-directory: beta/app
        env:
          APP_CHANNEL: beta
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_REPO_BRANCH: beta
          VITE_RUNTIME_SOURCES: ${{ vars.RUNTIME_SOURCES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export APP_BUILD_ID="$(git rev-parse --short HEAD)"
          npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000
          npm run build

      - name: Warn when beta is left out
        if: steps.channels.outputs.beta == 'true' && steps.beta_build.outcome != 'success'
        run: echo "::warning::Beta build failed; production is deployed without the beta channel"

      - name: Publish runtime assets
        working-directory: main/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_ASSETS_PROJECT: ${{ vars.CF_ASSETS_PROJECT }}
          RUNTIME_FORCE: ${{ inputs.force_runtime }}
        run: |
          ARGS=(--app production=. --worker-version ../workers/api/src/version.ts)
          if [ "${{ steps.beta_build.outcome }}" = "success" ]; then
            ARGS+=(--app beta=../../beta/app)
          elif [ "${{ steps.channels.outputs.beta }}" = "true" ]; then
            ARGS+=(--retain beta)
          fi
          npx --no-install tsx runtime/publish.ts "${ARGS[@]}"

      - name: Assemble site
        run: |
          ARGS=(--production main/app/dist --out site)
          if [ "${{ steps.beta_build.outcome }}" = "success" ]; then ARGS+=(--beta beta/app/dist-beta); fi
          node main/.github/workflows/scripts/assemble-site.mjs "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

  verify-beta:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.beta_outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Beta build failed, so beta was not updated. Production deployed normally."
          exit 1
