name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "app/**"
      - "docs/**"
      - "!docs/github/**"
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Bump the patch version of the selected branch before deploying"
        type: boolean
        default: false
      force_runtime:
        description: "Redeploy the runtime assets project even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

jobs:
  prepare:
    if: ${{ github.event_name == 'push' || inputs.bump_version || github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=$(bash .github/workflows/scripts/should-deploy-pages.sh "${{ github.event.before }}" "${{ github.sha }}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and commit patch version (skipped if a human already changed it in this push, or if app/ is untouched)
        if: ${{ steps.decide.outputs.deploy == 'true' && (github.event_name == 'push' || inputs.bump_version) }}
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: bash .github/workflows/scripts/bump-app-version.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Deploy from main, the only branch the github-pages environment accepts
        if: ${{ steps.decide.outputs.deploy == 'true' && github.ref_name != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref main

  release:
    needs: prepare
    if: ${{ !cancelled() && github.ref_name == 'main' && (needs.prepare.result == 'skipped' || (needs.prepare.result == 'success' && needs.prepare.outputs.deploy == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 0

      - id: channels
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.channels.outputs.beta == 'true'
        with:
          ref: beta
          path: beta
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/app/package-lock.json
            beta/app/package-lock.json

      - name: Build channels in parallel
        id: build
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          BETA_PRESENT: ${{ steps.channels.outputs.beta }}
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_RUNTIME_SOURCES: ${{ vars.RUNTIME_SOURCES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_channel() {
            local channel="$1" directory="$2" branch="$3"
            (
              cd "$directory"
              export APP_CHANNEL="$channel" VITE_REPO_BRANCH="$branch" APP_BUILD_ID="$(git rev-parse --short HEAD)"
              npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000
              npm run build
            ) >"$RUNNER_TEMP/build-$channel.log" 2>&1
          }

          build_channel production main/app "$PRODUCTION_BRANCH" &
          production_pid=$!
          beta_pid=""
          if [ "$BETA_PRESENT" = "true" ]; then
            build_channel beta beta/app beta &
            beta_pid=$!
          fi

          production_status=0
          wait "$production_pid" || production_status=$?
          beta_result=skipped
          if [ -n "$beta_pid" ]; then
            if wait "$beta_pid"; then beta_result=success; else beta_result=failure; fi
          fi

          for channel in production beta; do
            if [ -f "$RUNNER_TEMP/build-$channel.log" ]; then
              echo "::group::Build $channel"
              cat "$RUNNER_TEMP/build-$channel.log"
              echo "::endgroup::"
            fi
          done

          echo "beta=$beta_result" >> "$GITHUB_OUTPUT"
          if [ "$production_status" -ne 0 ]; then
            echo "::error::Production build failed"
          fi
          exit "$production_status"

      - name: Warn when beta is left out
        if: ${{ steps.channels.outputs.beta == 'true' && steps.build.outputs.beta != 'success' }}
        run: echo "::warning::Beta build failed; production is deployed without the beta channel"

      - name: Publish runtime assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_ASSETS_PROJECT: ${{ vars.CF_ASSETS_PROJECT }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          RUNTIME_FORCE: ${{ inputs.force_runtime }}
        run: |
          if [ -f main/app/runtime/publish.ts ]; then
            PUBLISHER_DIR=main/app
          elif [ "${{ steps.channels.outputs.beta }}" = "true" ] && [ -f beta/app/runtime/publish.ts ]; then
            PUBLISHER_DIR=beta/app
          else
            echo "::notice::No channel ships runtime/publish.ts yet; skipping runtime assets"
            exit 0
          fi
          ARGS=(--app "production=$GITHUB_WORKSPACE/main/app" --worker-version "$GITHUB_WORKSPACE/main/workers/api/src/version.ts")
          if [ "${{ steps.build.outputs.beta }}" = "success" ]; then
            ARGS+=(--app "beta=$GITHUB_WORKSPACE/beta/app")
          elif [ "${{ steps.channels.outputs.beta }}" = "true" ]; then
            ARGS+=(--retain beta)
          fi
          cd "$PUBLISHER_DIR"
          npx --no-install tsx runtime/publish.ts "${ARGS[@]}"

      - name: Assemble site
        run: |
          ARGS=(--production main/app/dist --out site)
          if [ "${{ steps.build.outputs.beta }}" = "success" ]; then ARGS+=(--beta beta/app/dist-beta); fi
          node main/.github/workflows/scripts/assemble-site.mjs "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Fail when beta was left out
        if: ${{ steps.channels.outputs.beta == 'true' && steps.build.outputs.beta == 'failure' }}
        run: |
          echo "::error::Beta build failed, so beta was not updated. Production deployed normally."
          exit 1
