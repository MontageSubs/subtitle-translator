name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "app/**"
      - "docs/**"
      - "!docs/github/**"
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Bump the patch version of the selected branch before deploying"
        type: boolean
        default: false
      force_runtime:
        description: "Redeploy the runtime assets project even when nothing changed"
        type: boolean
        default: false

jobs:
  relay:
    if: ${{ github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: prepare
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: bash .github/workflows/scripts/prepare-pages.sh "${{ github.event_name }}" "${{ inputs.bump_version }}" "${{ github.event.before }}" "${{ github.sha }}"

      - if: ${{ steps.prepare.outputs.deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref main

  release:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 0

      - id: prepare
        working-directory: main
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: bash .github/workflows/scripts/prepare-pages.sh "${{ github.event_name }}" "${{ inputs.bump_version }}" "${{ github.event.before }}" "${{ github.sha }}"

      - id: channels
        if: ${{ steps.prepare.outputs.deploy == 'true' }}
        working-directory: main
        run: echo "beta=$(git ls-remote --exit-code --heads origin beta >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.channels.outputs.beta == 'true' }}
        with:
          ref: beta
          path: beta

      - uses: actions/setup-node@v7
        if: ${{ steps.prepare.outputs.deploy == 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/app/package-lock.json
            beta/app/package-lock.json

      - id: build
        if: ${{ steps.prepare.outputs.deploy == 'true' }}
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          BETA_PRESENT: ${{ steps.channels.outputs.beta }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
        run: bash main/.github/workflows/scripts/build-channels.sh

      - if: ${{ steps.prepare.outputs.deploy == 'true' }}
        env:
          RUNTIME_FORCE: ${{ inputs.force_runtime }}
          BETA_PRESENT: ${{ steps.channels.outputs.beta }}
          BETA_RESULT: ${{ steps.build.outputs.beta }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          CF_TOKEN_PAGES: ${{ secrets.CF_TOKEN_PAGES }}
        run: bash main/.github/workflows/scripts/publish-runtime.sh

      - if: ${{ steps.prepare.outputs.deploy == 'true' }}
        env:
          BETA_RESULT: ${{ steps.build.outputs.beta }}
        run: |
          ARGS=(--production main/app/dist --out site)
          if [ "$BETA_RESULT" = success ]; then ARGS+=(--beta beta/app/dist-beta); fi
          node main/.github/workflows/scripts/assemble-site.mjs "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v5
        if: ${{ steps.prepare.outputs.deploy == 'true' }}
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
        if: ${{ steps.prepare.outputs.deploy == 'true' }}
