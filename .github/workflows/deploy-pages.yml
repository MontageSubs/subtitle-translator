name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "app/**"
      - "docs/**"
      - "!docs/github/**"
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Bump the patch version of the selected branch before deploying"
        type: boolean
        default: false
      force_runtime:
        description: "Redeploy the runtime assets project even when nothing changed"
        type: boolean
        default: false

jobs:
  prepare:
    if: ${{ github.ref_name == 'main' || github.ref_name == 'beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.prepare.outputs.deploy }}
      beta: ${{ steps.channels.outputs.beta }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP_VERSION: ${{ inputs.bump_version }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: bash .github/workflows/scripts/prepare-pages.sh "$EVENT_NAME" "$BUMP_VERSION" "$BEFORE_SHA" "$GITHUB_SHA"

      - id: channels
        run: echo "beta=$(git ls-remote --exit-code --heads origin beta >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
          fetch-depth: 0

      - uses: actions/checkout@v7
        if: ${{ needs.prepare.outputs.beta == 'true' }}
        with:
          ref: beta
          path: beta
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/app/package-lock.json
            beta/app/package-lock.json

      - id: build
        env:
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          BETA_PRESENT: ${{ needs.prepare.outputs.beta }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          TR_BUILD_SEAL_KEY: ${{ secrets.TR_BUILD_SEAL_KEY }}
        run: bash main/.github/workflows/scripts/build-channels.sh

      - env:
          RUNTIME_FORCE: ${{ inputs.force_runtime }}
          BETA_PRESENT: ${{ needs.prepare.outputs.beta }}
          BETA_RESULT: ${{ steps.build.outputs.beta }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          CF_TOKEN_PAGES: ${{ secrets.CF_TOKEN_PAGES }}
        run: bash main/.github/workflows/scripts/publish-runtime.sh

      - env:
          BETA_RESULT: ${{ steps.build.outputs.beta }}
        run: |
          ARGS=(--production main/app/dist --out site)
          if [ "$BETA_RESULT" = success ]; then ARGS+=(--beta beta/app/dist-beta); fi
          node main/.github/workflows/scripts/assemble-site.mjs "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
