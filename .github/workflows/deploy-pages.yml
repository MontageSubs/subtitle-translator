name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Bump and commit patch version (before build, skipped if a human already changed it in this push)
        if: github.event_name == 'push'
        run: |
          set -e
          BEFORE_VERSION=$(grep -o 'app-version" content="[^"]*"' index.html)
          node ../scripts/bump-patch-version.mjs index.html 'app-version" content="([^"]+)"' "${{ github.event.before }}"
          AFTER_VERSION=$(grep -o 'app-version" content="[^"]*"' index.html)
          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit --author="${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>" \
              -m "chore: bump app patch version [skip ci]" \
              -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push
          fi

      - name: Build
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
