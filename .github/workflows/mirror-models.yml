name: Mirror models to Cloudflare Pages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Redeploy the models project even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-models
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ vars.CF_MODELS_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - id: channels
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.channels.outputs.beta == 'true'
        with:
          ref: beta
          path: beta

      - id: publisher
        run: |
          if [ -f main/app/model-mirror/publish.ts ]; then
            echo "dir=main/app" >> "$GITHUB_OUTPUT"
          elif [ -f beta/app/model-mirror/publish.ts ]; then
            echo "dir=beta/app" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No channel ships model-mirror/publish.ts yet; nothing to mirror"
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.publisher.outputs.dir != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.publisher.outputs.dir }}/package-lock.json

      - name: Mirror models
        if: steps.publisher.outputs.dir != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_MODELS_PROJECT: ${{ vars.CF_MODELS_PROJECT }}
          MODELS_SOURCES: ${{ vars.MODELS_SOURCES }}
          MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}
          MIRROR_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          for channel in main beta; do
            if [ -d "$channel/app/src/model-catalog" ]; then ARGS+=(--catalog "$GITHUB_WORKSPACE/$channel/app/src/model-catalog"); fi
          done
          cd "${{ steps.publisher.outputs.dir }}"
          npm ci --prefer-offline --no-audit --no-fund
          npx --no-install tsx model-mirror/publish.ts "${ARGS[@]}"
