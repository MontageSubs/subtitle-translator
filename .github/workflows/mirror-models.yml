name: Mirror models to Cloudflare Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "app/src/model-catalog/**"
      - "app/model-mirror/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Redeploy the models project even when nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-models
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          persist-credentials: false

      - id: channels
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.channels.outputs.beta == 'true'
        with:
          ref: beta
          path: beta
          persist-credentials: false

      - id: publisher
        run: echo "dir=$(node main/.github/workflows/scripts/newest-channel.mjs --require model-mirror/publish.ts main/app beta/app)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.publisher.outputs.dir != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.publisher.outputs.dir }}/package-lock.json

      - name: Mirror models
        if: steps.publisher.outputs.dir != ''
        env:
          MIRROR_FORCE: ${{ inputs.force }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          CF_TOKEN_PAGES: ${{ secrets.CF_TOKEN_PAGES }}
        run: |
          source "$GITHUB_WORKSPACE/main/.github/workflows/scripts/load-config.sh" models
          [ -n "$PAGES_MODELS" ] || exit 0
          ARGS=()
          for channel in main beta; do
            id=$([ "$channel" = main ] && echo production || echo beta)
            if [ -d "$channel/app/src/model-catalog" ]; then ARGS+=(--catalog "$id=$GITHUB_WORKSPACE/$channel/app/src/model-catalog"); fi
          done
          cd "${{ steps.publisher.outputs.dir }}"
          npm ci --prefer-offline --no-audit --no-fund --silent
          npx --no-install tsx model-mirror/publish.ts "${ARGS[@]}"
