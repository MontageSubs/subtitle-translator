name: Manage D1 Database

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select action to execute'
        required: true
        type: choice
        options:
          - 'purge_ip'
          - 'reset_all'
      target_ip:
        description: 'Target IP address (required when action is purge_ip)'
        required: false
        type: string
      confirm:
        description: 'Type RESET_D1 to confirm (required when action is reset_all)'
        required: false
        type: string

jobs:
  manage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - name: Process Action and Mask Secrets
        id: prepare
        env:
          ACTION: ${{ inputs.action }}
          TARGET_IP: ${{ inputs.target_ip }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          ACCOUNT_EMAIL: ${{ secrets.CLOUDFLARE_ACCOUNT_EMAIL || secrets.ACCOUNT_EMAIL }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node -e '
          const crypto = require("crypto");
          const fs = require("fs");

          const email = (process.env.ACCOUNT_EMAIL || "").trim();
          if (email) console.log("::add-mask::" + email);

          const accountId = (process.env.ACCOUNT_ID || "").trim();
          if (accountId) console.log("::add-mask::" + accountId);

          const dbId = (process.env.D1_DATABASE_ID || "").trim();
          if (!dbId) {
            console.error("D1_DATABASE_ID secret is not set.");
            process.exit(1);
          }
          console.log("::add-mask::" + dbId);

          const cfgPath = `/tmp/wrangler.d1.${process.env.GITHUB_RUN_ID}.toml`;
          const d1Config = `name = "d1-manager"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "subtitle-translator"\ndatabase_id = "${dbId}"\n`;
          fs.writeFileSync(cfgPath, d1Config, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, "D1_CONFIG_PATH=" + cfgPath + "\n");

          const action = process.env.ACTION;
          const targetIp = (process.env.TARGET_IP || "").trim();
          const confirm = (process.env.CONFIRM_INPUT || "").trim();
          const salt = process.env.IP_HASH_SALT || "";

          if (action === "reset_all") {
            if (confirm !== "RESET_D1") {
              console.error("Confirmation text mismatch. Aborting reset.");
              process.exit(1);
            }
            console.log("Action validated: Full D1 Database Reset");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "mode=reset\n");
          } else if (action === "purge_ip") {
            if (!targetIp) {
              console.error("Target IP address is required for purge_ip action.");
              process.exit(1);
            }
            if (!salt) {
              console.error("IP_HASH_SALT secret is not configured in repository secrets.");
              process.exit(1);
            }

            console.log("::add-mask::" + targetIp);

            const hash = crypto.createHmac("sha256", salt).update(targetIp).digest("hex");
            console.log("::add-mask::" + hash);

            fs.appendFileSync(process.env.GITHUB_ENV, "TARGET_IP_HASH=" + hash + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "mode=purge\n");
            console.log("Target IP and calculated hash masked successfully.");
          } else {
            console.error("Invalid action specified.");
            process.exit(1);
          }
          '

      - name: Purge IP from D1 Database
        if: steps.prepare.outputs.mode == 'purge'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          set -o pipefail
          SQL_QUERY="DELETE FROM ip_shield WHERE ip_hash = '$TARGET_IP_HASH';"
          npx wrangler d1 execute DB --remote --config "$D1_CONFIG_PATH" --command "$SQL_QUERY" 2>&1 | bash ../../.github/workflows/scripts/sanitize-output.sh
          echo "Target IP records successfully purged from D1 database."

      - name: Reset D1 Database Tables
        if: steps.prepare.outputs.mode == 'reset'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          TMP_SQL="/tmp/reset_d1_${GITHUB_RUN_ID}.sql"

          cat << 'EOF' > "$TMP_SQL"
          DROP TABLE IF EXISTS ip_shield;
          DROP TABLE IF EXISTS retry_token_guard;
          DROP TABLE IF EXISTS global_budget;
          DROP TABLE IF EXISTS system_config;
          DROP TABLE IF EXISTS ip_reputation;
          EOF

          for f in migrations/*.sql; do
            echo "-- Migration: $f" >> "$TMP_SQL"
            cat "$f" >> "$TMP_SQL"
            echo "" >> "$TMP_SQL"
          done

          set -o pipefail
          npx wrangler d1 execute DB --remote --config "$D1_CONFIG_PATH" --file "$TMP_SQL" 2>&1 | bash ../../.github/workflows/scripts/sanitize-output.sh
          echo "D1 database successfully reset and all migrations applied."

      - name: Cleanup Temporary Files
        if: always()
        run: rm -f "$D1_CONFIG_PATH" "/tmp/reset_d1_${GITHUB_RUN_ID}.sql"
