name: Print WAF Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Print WAF rules for the current configuration
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          SITE: ${{ vars.SITE }}
        run: python3 .github/workflows/scripts/config.py waf
