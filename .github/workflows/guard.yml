name: Guard

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: python3 .github/workflows/scripts/lint-workflows.py

      - run: python3 .github/workflows/scripts/config.py check-docs
