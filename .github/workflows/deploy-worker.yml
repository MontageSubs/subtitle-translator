name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          SITE: ${{ secrets.SITE }}
          CF: ${{ secrets.CF }}
          TR_CONFIG: ${{ secrets.TR_CONFIG }}
          CF_TOKEN_WORKERS: ${{ secrets.CF_TOKEN_WORKERS }}
          DB_TURSO_URL: ${{ secrets.DB_TURSO_URL }}
          DB_TURSO_TOKEN: ${{ secrets.DB_TURSO_TOKEN }}
          TR_PROVIDER_KEY_GOOGLE: ${{ secrets.TR_PROVIDER_KEY_GOOGLE }}
          TR_CAPTCHA_SECRET: ${{ secrets.TR_CAPTCHA_SECRET }}
          TR_SIGNING_SALT: ${{ secrets.TR_SIGNING_SALT }}
          TR_PRIVACY_SALT_IP: ${{ secrets.TR_PRIVACY_SALT_IP }}
          TR_SIGNING_SECRET_A: ${{ secrets.TR_SIGNING_SECRET_A }}
          TR_SIGNING_SECRET_B: ${{ secrets.TR_SIGNING_SECRET_B }}
          TR_PROVIDER_KEY_GOOGLE_V2: ${{ secrets.TR_PROVIDER_KEY_GOOGLE_V2 }}
          TR_PROVIDER_KEY_DEEPL: ${{ secrets.TR_PROVIDER_KEY_DEEPL }}
          TR_UA_BLOCKLIST: ${{ secrets.TR_UA_BLOCKLIST }}
        run: bash .github/workflows/scripts/deploy-worker.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}"
