name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - run: npm run typecheck

      - name: Mask Sensitive Identifiers
        env:
          ACCOUNT_EMAIL: ${{ secrets.CLOUDFLARE_ACCOUNT_EMAIL || secrets.ACCOUNT_EMAIL }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          for val in "$ACCOUNT_EMAIL" "$ACCOUNT_ID" "$D1_DATABASE_ID"; do
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done

      - name: Bump and commit patch version (before deploy, skipped if a human already changed it in this push)
        if: github.event_name == 'push'
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          bash ../../.github/workflows/scripts/bump-and-commit.sh src/index.ts 'WORKER_VERSION = "([^"]+)"' "update: worker v" "${{ github.event.before }}"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || secrets.ALLOWED_ORIGIN }}
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          RISKY_ASNS: ${{ secrets.RISKY_ASNS }}
          QUARANTINE_BASE_DAYS: ${{ secrets.QUARANTINE_BASE_DAYS }}
          QUARANTINE_MAX_DAYS: ${{ secrets.QUARANTINE_MAX_DAYS }}
          DAILY_FREE_QUOTA: ${{ secrets.DAILY_FREE_QUOTA }}
          DAILY_CAPTCHA_CAP: ${{ secrets.DAILY_CAPTCHA_CAP }}
          BLOCK_DURATION_DAYS: ${{ secrets.BLOCK_DURATION_DAYS }}
          MALFORMED_THRESHOLD: ${{ secrets.MALFORMED_THRESHOLD }}
          HANDSHAKE_ABUSE_THRESHOLD: ${{ secrets.HANDSHAKE_ABUSE_THRESHOLD }}
          ABUSE_WINDOW_MINUTES: ${{ secrets.ABUSE_WINDOW_MINUTES }}
          GLOBAL_DAILY_BUDGET: ${{ secrets.GLOBAL_DAILY_BUDGET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_AUTH_TOKEN: ${{ secrets.TURSO_WRITE_AUTH_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          GOOGLE_TRANSLATE_V2_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_V2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          WORKER_SALT: ${{ secrets.WORKER_SALT }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          WORKER_SECRET_A: ${{ secrets.WORKER_SECRET_A }}
          WORKER_SECRET_B: ${{ secrets.WORKER_SECRET_B }}
        run: |
          set -e
          TMP_CONFIG="/tmp/wrangler.api.${GITHUB_RUN_ID}.toml"
          TMP_SECRETS="/tmp/secrets.api.${GITHUB_RUN_ID}.json"
          trap 'rm -f "$TMP_CONFIG" "$TMP_SECRETS"' EXIT

          python3 ../../.github/workflows/scripts/prepare-worker-deploy.py "$TMP_CONFIG" "$TMP_SECRETS"
          chmod 600 "$TMP_CONFIG" "$TMP_SECRETS"

          VERSION_VAL=$(sed -n 's/.*WORKER_VERSION = "\([^"]*\)".*/\1/p' src/index.ts)
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "$GITHUB_SHA" | cut -c1-7)
          TAG_VAL="v${VERSION_VAL:-1.0.0}"
          MSG="worker api ${TAG_VAL} (${COMMIT_HASH})"

          set -o pipefail
          npx wrangler deploy \
            --config "$TMP_CONFIG" \
            --secrets-file "$TMP_SECRETS" \
            --message "$MSG" \
            --tag "$TAG_VAL" 2>&1 | bash ../../.github/workflows/scripts/sanitize-output.sh
