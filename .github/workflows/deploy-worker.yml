name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - run: npm run typecheck

      - name: Bump and commit patch version (before deploy, skipped if a human already changed it in this push)
        if: github.event_name == 'push'
        env:
          GITHUB_HEAD_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GITHUB_HEAD_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          bash ../../.github/workflows/scripts/bump-and-commit.sh src/index.ts 'WORKER_VERSION = "([^"]+)"' "update: worker v" "${{ github.event.before }}" "${{ github.sha }}"

      - name: Deploy to Cloudflare Workers
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || secrets.ALLOWED_ORIGIN }}
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          RISKY_ASNS: ${{ secrets.RISKY_ASNS }}
          QUARANTINE_BASE_DAYS: ${{ secrets.QUARANTINE_BASE_DAYS }}
          QUARANTINE_MAX_DAYS: ${{ secrets.QUARANTINE_MAX_DAYS }}
          DAILY_FREE_QUOTA: ${{ secrets.DAILY_FREE_QUOTA }}
          DAILY_CAPTCHA_CAP: ${{ secrets.DAILY_CAPTCHA_CAP }}
          BLOCK_DURATION_DAYS: ${{ secrets.BLOCK_DURATION_DAYS }}
          MALFORMED_THRESHOLD: ${{ secrets.MALFORMED_THRESHOLD }}
          HANDSHAKE_ABUSE_THRESHOLD: ${{ secrets.HANDSHAKE_ABUSE_THRESHOLD }}
          ABUSE_WINDOW_MINUTES: ${{ secrets.ABUSE_WINDOW_MINUTES }}
          GLOBAL_DAILY_BUDGET: ${{ secrets.GLOBAL_DAILY_BUDGET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_AUTH_TOKEN: ${{ secrets.TURSO_WRITE_AUTH_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          GOOGLE_TRANSLATE_V2_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_V2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          WORKER_SALT: ${{ secrets.WORKER_SALT }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          WORKER_SECRET_A: ${{ secrets.WORKER_SECRET_A }}
          WORKER_SECRET_B: ${{ secrets.WORKER_SECRET_B }}
        run: bash ../../.github/workflows/scripts/deploy-worker.sh
