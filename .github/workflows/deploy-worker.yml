name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Inject D1 database_id
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -e
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "D1_DATABASE_ID secret not set" >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy

      - name: Sync secrets
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_AUTH_TOKEN: ${{ secrets.TURSO_WRITE_AUTH_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          WORKER_SALT: ${{ secrets.WORKER_SALT }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          RISKY_ASNS: ${{ secrets.RISKY_ASNS }}
          QUARANTINE_BASE_DAYS: ${{ secrets.QUARANTINE_BASE_DAYS }}
          QUARANTINE_MAX_DAYS: ${{ secrets.QUARANTINE_MAX_DAYS }}
          DAILY_FREE_QUOTA: ${{ secrets.DAILY_FREE_QUOTA }}
          DAILY_CAPTCHA_CAP: ${{ secrets.DAILY_CAPTCHA_CAP }}
          BLOCK_DURATION_DAYS: ${{ secrets.BLOCK_DURATION_DAYS }}
          MALFORMED_THRESHOLD: ${{ secrets.MALFORMED_THRESHOLD }}
          HANDSHAKE_ABUSE_THRESHOLD: ${{ secrets.HANDSHAKE_ABUSE_THRESHOLD }}
          ABUSE_WINDOW_MINUTES: ${{ secrets.ABUSE_WINDOW_MINUTES }}
          GLOBAL_DAILY_BUDGET: ${{ secrets.GLOBAL_DAILY_BUDGET }}
        run: |
          set -e
          for name in TURNSTILE_SECRET_KEY TURSO_URL TURSO_WRITE_AUTH_TOKEN GOOGLE_TRANSLATE_API_KEY WORKER_SALT IP_HASH_SALT RISKY_ASNS QUARANTINE_BASE_DAYS QUARANTINE_MAX_DAYS DAILY_FREE_QUOTA DAILY_CAPTCHA_CAP BLOCK_DURATION_DAYS MALFORMED_THRESHOLD HANDSHAKE_ABUSE_THRESHOLD ABUSE_WINDOW_MINUTES GLOBAL_DAILY_BUDGET; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set)"
            fi
          done
