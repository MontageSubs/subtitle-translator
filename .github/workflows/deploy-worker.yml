name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Bump patch version (skipped if a human already changed it in this push)
        id: bump
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          BEFORE_VERSION=$(grep -o 'WORKER_VERSION = "[^"]*"' src/index.ts)
          node ../../scripts/bump-patch-version.mjs src/index.ts 'WORKER_VERSION = "([^"]+)"' "$BEFORE"
          AFTER_VERSION=$(grep -o 'WORKER_VERSION = "[^"]*"' src/index.ts)
          [ "$BEFORE_VERSION" = "$AFTER_VERSION" ] && echo "should_bump=false" >> "$GITHUB_OUTPUT" || echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Inject D1 database_id / tunable thresholds
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TRANSLATION_PROVIDER: ${{ secrets.TRANSLATION_PROVIDER }}
          RISKY_ASNS: ${{ secrets.RISKY_ASNS }}
          QUARANTINE_BASE_DAYS: ${{ secrets.QUARANTINE_BASE_DAYS }}
          QUARANTINE_MAX_DAYS: ${{ secrets.QUARANTINE_MAX_DAYS }}
          DAILY_FREE_QUOTA: ${{ secrets.DAILY_FREE_QUOTA }}
          DAILY_CAPTCHA_CAP: ${{ secrets.DAILY_CAPTCHA_CAP }}
          BLOCK_DURATION_DAYS: ${{ secrets.BLOCK_DURATION_DAYS }}
          MALFORMED_THRESHOLD: ${{ secrets.MALFORMED_THRESHOLD }}
          HANDSHAKE_ABUSE_THRESHOLD: ${{ secrets.HANDSHAKE_ABUSE_THRESHOLD }}
          ABUSE_WINDOW_MINUTES: ${{ secrets.ABUSE_WINDOW_MINUTES }}
          GLOBAL_DAILY_BUDGET: ${{ secrets.GLOBAL_DAILY_BUDGET }}
        run: |
          set -e
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "D1_DATABASE_ID secret not set" >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          for name in TRANSLATION_PROVIDER RISKY_ASNS QUARANTINE_BASE_DAYS QUARANTINE_MAX_DAYS DAILY_FREE_QUOTA DAILY_CAPTCHA_CAP BLOCK_DURATION_DAYS MALFORMED_THRESHOLD HANDSHAKE_ABUSE_THRESHOLD ABUSE_WINDOW_MINUTES GLOBAL_DAILY_BUDGET; do
            value="${!name}"
            if [ -n "$value" ]; then
              sed -i "s/^$name = \".*\"/$name = \"$value\"/" wrangler.toml
            fi
          done

      - name: Deploy
        run: npx wrangler deploy

      - name: Sync secrets
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_AUTH_TOKEN: ${{ secrets.TURSO_WRITE_AUTH_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          GOOGLE_TRANSLATE_V2_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_V2_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          WORKER_SALT: ${{ secrets.WORKER_SALT }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          set -e
          for name in TURNSTILE_SECRET_KEY TURSO_URL TURSO_WRITE_AUTH_TOKEN GOOGLE_TRANSLATE_API_KEY GOOGLE_TRANSLATE_V2_API_KEY DEEPL_API_KEY WORKER_SALT IP_HASH_SALT; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set)"
            fi
          done

      - name: Commit bumped version
        if: github.event_name == 'push' && steps.bump.outputs.should_bump == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "chore: bump worker patch version [skip ci]"
          git push
