name: Rotate Worker Secret

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci

      - name: Rotate Worker Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: node ../../.github/workflows/scripts/rotate-worker-secret.mjs

