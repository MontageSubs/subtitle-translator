name: Rotate Worker Secret

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Rotate the slot due today
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          DAY_OF_YEAR=$(date -u +%j)
          if [ $((10#$DAY_OF_YEAR % 2)) -eq 0 ]; then
            SLOT=WORKER_SECRET_A
          else
            SLOT=WORKER_SECRET_B
          fi
          NEW_VALUE=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          printf '%s' "$NEW_VALUE" | npx wrangler secret put "$SLOT"
