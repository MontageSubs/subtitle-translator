name: Rotate Worker Secret

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - name: Rotate the slot due today
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          NOW=$(date -u +%s)
          WEEKS=$((NOW / 604800))
          if [ $((WEEKS % 2)) -eq 0 ]; then
            SLOT=WORKER_SECRET_B
          else
            SLOT=WORKER_SECRET_A
          fi
          NEW_VALUE=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          if [ -z "$NEW_VALUE" ]; then exit 1; fi
          printf '%s' "$NEW_VALUE" | npx wrangler secret put "$SLOT"
