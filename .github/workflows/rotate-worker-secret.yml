name: Rotate Worker Secret

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - name: Rotate
        env:
          WRANGLER_SEND_METRICS: "false"
          CF: ${{ secrets.CF }}
          CF_TOKEN_WORKERS: ${{ secrets.CF_TOKEN_WORKERS }}
        run: |
          set -o pipefail
          source .github/workflows/scripts/load-config.sh cloudflare
          cd workers/api
          npm ci --prefer-offline --no-audit --no-fund --silent
          node ../../.github/workflows/scripts/rotate-worker-secret.mjs 2>&1 | bash ../../.github/workflows/scripts/sanitize-output.sh
