name: Rotate Worker Secret

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000

      - name: Rotate Worker Secret
        env:
          WRANGLER_SEND_METRICS: "false"
          CF_NAMES: ${{ vars.CF_NAMES }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CF_TOKEN_WORKERS: ${{ secrets.CF_TOKEN_WORKERS }}
        run: bash -c "set -o pipefail; source ../../.github/workflows/scripts/load-config.sh cloudflare && node ../../.github/workflows/scripts/rotate-worker-secret.mjs 2>&1 | bash ../../.github/workflows/scripts/sanitize-output.sh"
