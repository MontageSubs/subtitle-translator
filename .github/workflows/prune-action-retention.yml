name: Prune Action Retention

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days of logs and artifacts to retain"
        required: false
        default: "7"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-action-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prune expired workflow logs and artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          RETENTION_DAYS="${INPUT_RETENTION_DAYS:-7}"
          CUTOFF_ISO=$(date -u -d "${RETENTION_DAYS} days ago" +"%Y-%m-%dT%H:%M:%SZ")
          CUTOFF_DATE=$(date -u -d "${RETENTION_DAYS} days ago" +"%Y-%m-%d")

          echo "Target cutoff: older than ${RETENTION_DAYS} days (${CUTOFF_ISO})"

          echo "Fetching and pruning unexpired artifacts..."
          ARTIFACT_IDS=$(gh api --paginate "/repos/${GH_REPO}/actions/artifacts?per_page=100" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --jq ".artifacts[] | select(.created_at < \"${CUTOFF_ISO}\" and .expired == false) | .id" 2>/dev/null || true)

          PRUNED_ARTIFACTS=0
          for artifact_id in ${ARTIFACT_IDS}; do
            [ -n "${artifact_id}" ] || continue
            if gh api --method DELETE "/repos/${GH_REPO}/actions/artifacts/${artifact_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --silent >/dev/null 2>&1; then
              PRUNED_ARTIFACTS=$((PRUNED_ARTIFACTS + 1))
            fi
          done
          echo "Pruned ${PRUNED_ARTIFACTS} artifacts."

          echo "Fetching and pruning logs for completed workflow runs..."
          RUN_IDS=$(gh api --paginate "/repos/${GH_REPO}/actions/runs?status=completed&created=%3C${CUTOFF_DATE}&per_page=100" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --jq ".workflow_runs[].id" 2>/dev/null || true)

          PRUNED_LOGS=0
          for run_id in ${RUN_IDS}; do
            [ -n "${run_id}" ] || continue
            if gh api --method DELETE "/repos/${GH_REPO}/actions/runs/${run_id}/logs" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --silent >/dev/null 2>&1; then
              PRUNED_LOGS=$((PRUNED_LOGS + 1))
            fi
          done
          echo "Pruned logs for ${PRUNED_LOGS} workflow runs."
