<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Montage Subtitle Translator</title>
    <meta name="description" content="Free subtitle translator — translate SRT subtitles in your browser with bilingual or monolingual output, no server-side storage." />
    <meta name="keywords" content="subtitle translator, translate subtitles, SRT translator, bilingual subtitles" />
    <meta property="og:title" content="Montage Subtitle Translator" />
    <meta property="og:description" content="Translate SRT subtitles in your browser — bilingual or monolingual output, no server-side storage." />
    <meta property="og:type" content="website" />
    <link rel="alternate" hreflang="en" href="./en/nmt/" />
    <link rel="alternate" hreflang="zh-Hans" href="./zh-Hans/nmt/" />
    <link rel="alternate" hreflang="zh-Hant" href="./zh-Hant/nmt/" />
    <link rel="alternate" hreflang="x-default" href="./en/nmt/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (segment) { return segment.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        var GATE_FLAG = "subtitle-translator:language-gate-redirected";
        var basePath = "%VITE_BASE_PATH%" || "/";
        var path = location.pathname;
        if (path.indexOf(basePath) !== 0) return;
        var rest = path.slice(basePath.length).replace(/^index\.html$/, "");
        if (rest.length > 0) return;
        try {
          if (sessionStorage.getItem(GATE_FLAG)) return;
          sessionStorage.setItem(GATE_FLAG, "1");
        } catch (e) {}
        var lang = (navigator.language || "en").toLowerCase();
        var target = "en";
        if (lang.indexOf("zh") === 0) {
          var isTraditional = lang.indexOf("hant") !== -1 || lang.indexOf("zh-tw") === 0 || lang.indexOf("zh-hk") === 0 || lang.indexOf("zh-mo") === 0;
          target = isTraditional ? "zh-Hant" : "zh-Hans";
        }
        location.replace(basePath + target + "/nmt/");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="js-required">
        <p class="js-required__title">This site requires JavaScript to run the translator.</p>
        <p class="muted">Enable JavaScript, or choose a language below to view static pages.</p>
        <div class="footer-nav">
          <a href="%VITE_BASE_PATH%zh-Hans/nmt/">简体中文</a>
          <a href="%VITE_BASE_PATH%zh-Hant/nmt/">繁體中文</a>
          <a href="%VITE_BASE_PATH%en/nmt/">English</a>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
