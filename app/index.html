<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b5482f" />
    <meta name="app-version" content="0.0.10-beta" />
    <title>Montage Subtitle Translator</title>
    <meta name="description" content="Montage Subtitle Translator — High-performance browser-based subtitle translation tool with privacy-first client-side parsing and stateless API integration." />
    <meta name="keywords" content="Montage Subtitle Translator, subtitle translator, SRT translator, VTT translator, bilingual subtitles, AI subtitle translation, subtitle editor" />
    <meta property="og:title" content="Montage Subtitle Translator" />
    <meta property="og:description" content="Montage Subtitle Translator — Fast, privacy-first subtitle translation in your browser with smart context awareness and bilingual output." />
    <meta property="og:type" content="website" />
    <link rel="alternate" hreflang="en" href="./en/" />
    <link rel="alternate" hreflang="zh-Hans" href="./zh-Hans/" />
    <link rel="alternate" hreflang="zh-Hant" href="./zh-Hant/" />
    <link rel="alternate" hreflang="x-default" href="./en/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (segment) { return segment.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        var GATE_FLAG = "subtitle-translator:language-gate-redirected";
        var basePath = "%BASE_URL%" || "/";
        var path = location.pathname;
        if (path.indexOf(basePath) !== 0) return;
        var rest = path.slice(basePath.length).replace(/^index\.html$/, "");
        if (rest.length > 0) return;
        try {
          if (sessionStorage.getItem(GATE_FLAG)) return;
          sessionStorage.setItem(GATE_FLAG, "1");
        } catch (e) {}
        var lang = (navigator.language || "en").toLowerCase();
        var target = "en";
        if (lang.indexOf("zh") === 0) {
          var isTraditional = lang.indexOf("hant") !== -1 || lang.indexOf("zh-tw") === 0 || lang.indexOf("zh-hk") === 0 || lang.indexOf("zh-mo") === 0;
          target = isTraditional ? "zh-Hant" : "zh-Hans";
        }
        location.replace(basePath + target + "/");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <style>
        :root{--bg:#faf9f6;--panel:#ffffff;--text:#1c1b19;--line:#e4e0d6;--accent:#b5482f}
        @media(prefers-color-scheme:dark){:root{--bg:#16151a;--panel:#1e1d23;--text:#ece9e2;--line:#322f36;--accent:#e18a63}}
        html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
        .language-gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;background:var(--bg)}
        .language-gate h1{font-size:1.5rem;font-weight:600;margin:0 0 24px;letter-spacing:-0.01em;color:var(--text)}
        .language-options{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;max-width:740px;margin:0 auto}
        .language-options a{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:110px;padding:10px 20px;border-radius:9999px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;font-size:0.95rem;font-weight:500;white-space:nowrap;transition:border-color .15s ease,color .15s ease}
        .language-options a:hover,.language-options a:focus{border-color:var(--accent);color:var(--accent)}
      </style>
      <div class="language-gate">
        <h1>Select Language</h1>
        <div class="language-options">
          <a href="./en/">English</a>
          <a href="./zh-Hans/">简体中文</a>
          <a href="./zh-Hant/">繁體中文</a>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
