<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Subtitle Translator · 字幕翻译工具</title>
    <meta name="description" content="Free subtitle translator — translate SRT subtitles in your browser with bilingual or monolingual output. 免费字幕翻译工具，浏览器本地拆分与合并，支持双语/单语字幕输出。" />
    <meta name="keywords" content="subtitle translator, translate subtitles, SRT translator, 字幕翻译, 字幕翻译工具, 双语字幕" />
    <meta property="og:title" content="Subtitle Translator · 字幕翻译工具" />
    <meta property="og:description" content="Translate SRT subtitles in your browser — bilingual or monolingual output, no server-side storage." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (segment) { return segment.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
