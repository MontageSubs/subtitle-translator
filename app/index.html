<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141318" media="(prefers-color-scheme: dark)" />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (segment) { return segment.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function (doc) {
        var held = { armed: true, files: [], entries: [] };
        window.__earlyIntake = held;
        function zoneOf(event) {
          var target = event.target;
          return held.armed && target && target.closest ? target.closest("#dropzone") : null;
        }
        function markBusy(zone) {
          zone.setAttribute("data-intake", "busy");
        }
        doc.addEventListener("change", function (event) {
          var input = event.target;
          var zone = input && input.id === "subtitle-file" ? zoneOf(event) : null;
          if (!zone || !input.files || !input.files.length) return;
          held.files.push.apply(held.files, input.files);
          input.value = "";
          markBusy(zone);
        }, true);
        ["dragenter", "dragover"].forEach(function (type) {
          doc.addEventListener(type, function (event) {
            if (zoneOf(event)) event.preventDefault();
          }, true);
        });
        doc.addEventListener("drop", function (event) {
          var zone = zoneOf(event);
          var transfer = event.dataTransfer;
          if (!zone || !transfer) return;
          event.preventDefault();
          var entries = Array.prototype.map.call(transfer.items || [], function (item) {
            return item.kind === "file" && item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
          }).filter(Boolean);
          if (entries.length) held.entries.push.apply(held.entries, entries);
          else held.files.push.apply(held.files, transfer.files);
          markBusy(zone);
        }, true);
      })(document);
    </script>
    <script>
      (function () {
        var GATE_FLAG = __I18N_GATE_FLAG__;
        var basePath = "%BASE_URL%" || "/";
        var path = location.pathname;
        if (path.indexOf(basePath) !== 0) return;
        var rest = path.slice(basePath.length).replace(/^index\.html$/, "").replace(/^\/+/, "");
        if (__I18N_SUPPORTED__.indexOf(rest.split("/")[0]) !== -1) return;
        try {
          if (sessionStorage.getItem(GATE_FLAG)) return;
          sessionStorage.setItem(GATE_FLAG, "1");
        } catch (e) {}
        var target = __I18N_RESOLVER__;
        var targetPath = basePath + target + "/" + (rest ? rest.replace(/\/+$/, "") + "/" : "");
        location.replace(targetPath + (location.search || "") + (location.hash || ""));
      })();
    </script>
    <!--root-head-->
    <!--seo:verification-->
    <!--seo:robots-->
    <!--i18n:language-gate-style-->
  </head>
  <body>
    <div id="app"></div>
    <!--i18n:language-gate-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
