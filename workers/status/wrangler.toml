name = "translate-status"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = true

[triggers]
crons = ["REPLACE_WITH_CRON_SCHEDULE"]

[[d1_databases]]
binding = "DB"
database_name = "subtitle-translator"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
CF_PAGES_PROJECT = "REPLACE_WITH_PAGES_PROJECT_NAME"
CF_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
ALLOWED_ORIGIN = "*"
MAIN_SITE_URL = "https://subs.js.org/subtitle-translator/"
ISSUE_REPORT_URL = "https://subs.js.org/subtitle-translator/docs/report-issue/"
GITHUB_REPO_URL = "https://github.com/MontageSubs/subtitle-translator"
STATUS_URL = "https://status.translate.sub.qzz.io"
